services:
  ycrpc-backend:
    build:
      context: .
      dockerfile: Dockerfile-backend
    ports:
      - "8080:8080"
    depends_on:
      yugabyte-postinstall-setup:
        condition: service_completed_successfully
      ycrpc-migrations:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgres://yugabyte:yugabyte@yb-tserver-usa:5433,yb-tserver-eur:5433,yb-tserver-ind:5433,yb-tserver-sgp:5433/yugabyte
    networks:
      - ycrpc-network

  ycrpc-ui:
    build:
      context: .
      dockerfile: Dockerfile-ui
    ports:
      - "3000:3000"
    depends_on:
      - ycrpc-backend
    networks:
      - ycrpc-network
    environment:
      - NODE_ENV=production

  # Tablespace Setup (must run first, after cluster initialization)
  yugabyte-postinstall-setup:
    image: postgres:15
    container_name: yugabyte-postinstall-setup
    command: |
      bash -c '
        set -e
        echo "Waiting 30 seconds for YugabyteDB cluster to be ready..."
        sleep 30
        
        echo "Creating tablespaces..."
        if psql -h yb-tserver-usa -p 5433 -U yugabyte -d yugabyte -v ON_ERROR_STOP=1 -f /setup/setup-tablespaces.sql; then
          echo "Tablespaces created successfully!"
        else
          echo "ERROR: Tablespace creation failed!"
          exit 1
        fi
      '
    volumes:
      - ./yugabyte-postinstall-setup:/setup:ro
    environment:
      - PGPASSWORD=yugabyte
    depends_on:
      - yb-master-1
      - yb-master-2
      - yb-master-3
      - yb-tserver-usa
      - yb-tserver-eur
      - yb-tserver-ind
      - yb-tserver-sgp
    networks:
      - ycrpc-network
    restart: "no"

  # Database Migrations (runs after tablespaces are created)
  ycrpc-migrations:
    image: postgres:15
    container_name: ycrpc-migrations
    command: |
      bash -c '
        set -e
        echo "Running migrations..."
        if psql -h yb-tserver-usa -p 5433 -U yugabyte -d yugabyte -v ON_ERROR_STOP=1 -f /migrations/initdb.sql; then
          echo "Migrations completed successfully!"
        else
          echo "ERROR: Migrations failed!"
          exit 1
        fi
      '
    volumes:
      - ./go/sqlc/migrations:/migrations:ro
    environment:
      - PGPASSWORD=yugabyte
    depends_on:
      yugabyte-postinstall-setup:
        condition: service_completed_successfully
    networks:
      - ycrpc-network
    restart: "no"

  # YugabyteDB Masters (3 for quorum)
  yb-master-1:
    image: yugabytedb/yugabyte:latest
    container_name: yb-master-1
    hostname: yb-master-1
    command: [
      "bin/yb-master",
      "--fs_data_dirs=/mnt/disk0",
      "--master_addresses=yb-master-1:7100,yb-master-2:7100,yb-master-3:7100",
      "--replication_factor=1",
      "--rpc_bind_addresses=yb-master-1:7100"
    ]
    ports:
      - "7100:7100"
      - "17000:7000"
    volumes:
      - ./vol-master-1:/mnt/disk0
    networks:
      - ycrpc-network

  yb-master-2:
    image: yugabytedb/yugabyte:latest
    container_name: yb-master-2
    hostname: yb-master-2
    command: [
      "bin/yb-master",
      "--fs_data_dirs=/mnt/disk0",
      "--master_addresses=yb-master-1:7100,yb-master-2:7100,yb-master-3:7100",
      "--replication_factor=1",
      "--rpc_bind_addresses=yb-master-2:7100"
    ]
    ports:
      - "7101:7100"
      - "17001:7000"
    volumes:
      - ./vol-master-2:/mnt/disk0
    depends_on:
      - yb-master-1
    networks:
      - ycrpc-network

  yb-master-3:
    image: yugabytedb/yugabyte:latest
    container_name: yb-master-3
    hostname: yb-master-3
    command: [
      "bin/yb-master",
      "--fs_data_dirs=/mnt/disk0",
      "--master_addresses=yb-master-1:7100,yb-master-2:7100,yb-master-3:7100",
      "--replication_factor=1",
      "--rpc_bind_addresses=yb-master-3:7100"
    ]
    ports:
      - "7102:7100"
      - "17002:7000"
    volumes:
      - ./vol-master-3:/mnt/disk0
    depends_on:
      - yb-master-1
    networks:
      - ycrpc-network

  # YugabyteDB TServers (1 per region)
  yb-tserver-usa:
    image: yugabytedb/yugabyte:latest
    container_name: yb-tserver-usa
    hostname: yb-tserver-usa
    command: [
      "bin/yb-tserver",
      "--fs_data_dirs=/mnt/disk0",
      "--tserver_master_addrs=yb-master-1:7100,yb-master-2:7100,yb-master-3:7100",
      "--rpc_bind_addresses=yb-tserver-usa:9100",
      "--pgsql_proxy_bind_address=yb-tserver-usa:5433",
      "--placement_cloud=local",
      "--placement_region=usa",
      "--placement_zone=usa-a"
    ]
    ports:
      - "5433:5433"
      - "9100:9100"
      - "19000:9000"
    volumes:
      - ./vol-usa:/mnt/disk0
    depends_on:
      - yb-master-1
      - yb-master-2
      - yb-master-3
    networks:
      - ycrpc-network

  yb-tserver-eur:
    image: yugabytedb/yugabyte:latest
    container_name: yb-tserver-eur
    hostname: yb-tserver-eur
    command: [
      "bin/yb-tserver",
      "--fs_data_dirs=/mnt/disk0",
      "--tserver_master_addrs=yb-master-1:7100,yb-master-2:7100,yb-master-3:7100",
      "--rpc_bind_addresses=yb-tserver-eur:9100",
      "--pgsql_proxy_bind_address=yb-tserver-eur:5433",
      "--placement_cloud=local",
      "--placement_region=eur",
      "--placement_zone=eur-a"
    ]
    ports:
      - "5434:5433"
      - "9101:9100"
      - "19001:9000"
    volumes:
      - ./vol-eur:/mnt/disk0
    depends_on:
      - yb-master-1
      - yb-master-2
      - yb-master-3
    networks:
      - ycrpc-network

  yb-tserver-ind:
    image: yugabytedb/yugabyte:latest
    container_name: yb-tserver-ind
    hostname: yb-tserver-ind
    command: [
      "bin/yb-tserver",
      "--fs_data_dirs=/mnt/disk0",
      "--tserver_master_addrs=yb-master-1:7100,yb-master-2:7100,yb-master-3:7100",
      "--rpc_bind_addresses=yb-tserver-ind:9100",
      "--pgsql_proxy_bind_address=yb-tserver-ind:5433",
      "--placement_cloud=local",
      "--placement_region=ind",
      "--placement_zone=ind-a"
    ]
    ports:
      - "5435:5433"
      - "9102:9100"
      - "19002:9000"
    volumes:
      - ./vol-ind:/mnt/disk0
    depends_on:
      - yb-master-1
      - yb-master-2
      - yb-master-3
    networks:
      - ycrpc-network

  yb-tserver-sgp:
    image: yugabytedb/yugabyte:latest
    container_name: yb-tserver-sgp
    hostname: yb-tserver-sgp
    command: [
      "bin/yb-tserver",
      "--fs_data_dirs=/mnt/disk0",
      "--tserver_master_addrs=yb-master-1:7100,yb-master-2:7100,yb-master-3:7100",
      "--rpc_bind_addresses=yb-tserver-sgp:9100",
      "--pgsql_proxy_bind_address=yb-tserver-sgp:5433",
      "--placement_cloud=local",
      "--placement_region=sgp",
      "--placement_zone=sgp-a"
    ]
    ports:
      - "5436:5433"
      - "9103:9100"
      - "19003:9000"
    volumes:
      - ./vol-sgp:/mnt/disk0
    depends_on:
      - yb-master-1
      - yb-master-2
      - yb-master-3
    networks:
      - ycrpc-network

networks:
  ycrpc-network:
    driver: bridge
